[package]
name = "file-browser"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing", "yaml-load"] }
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-width = "0.2"
pdfium-render = { version = "0.9", default-features = false, features = ["image_025", "thread_safe", "pdfium_latest"] }
resvg = "0.48"
kamadak-exif = "0.6"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
regex = "1"
similar = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
